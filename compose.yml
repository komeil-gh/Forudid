name: forudid
services:
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?run scripts/init_env.py}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports: ["127.0.0.1:${DB_PORT:-55432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?required}
    ports: ["127.0.0.1:${S3_PORT:-59000}:9000"]
    volumes: ["object-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
  initialize:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://object-storage:9000
    command: ["sh", "-c", "alembic upgrade head && python -m forudid_api.seed"]
    depends_on:
      postgres: {condition: service_healthy}
      object-storage: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://object-storage:9000
    ports: ["127.0.0.1:${API_PORT:-58000}:8000"]
    depends_on:
      initialize: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    profiles: ["tools"]
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://object-storage:9000
    command: ["python", "-m", "forudid_api.seed"]
    depends_on:
      postgres: {condition: service_healthy}
      object-storage: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: infra/docker/web.Dockerfile}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 10
  reverse-proxy:
    image: caddy:2.10.2-alpine
    ports: ["127.0.0.1:${LOCAL_PORT:-58080}:80"]
    volumes: ["./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [api, web]
volumes:
  postgres-data:
  object-data:
