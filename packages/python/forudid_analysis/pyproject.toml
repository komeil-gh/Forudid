[project]
name = "forudid-analysis"
version = "0.3.0a2"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.2,<3", "rasterio>=1.4,<2", "pyproj>=3.7,<4", "shapely>=2.1,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
