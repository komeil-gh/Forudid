[project]
name = "forudid-api"
version = "0.3.0a4"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "geoalchemy2>=0.17,<1",
  "boto3>=1.38,<2",
  "pystac[validation]>=1.13,<2",
  "titiler.core>=0.24,<1",
  "zarr>=3.0,<4",
  "numpy>=2.2,<3",
  "rasterio>=1.4,<2",
  "osmium>=4.3.1,<5",
  "forudid-analysis",
]

[tool.uv.sources]
forudid-analysis = { path = "../../packages/python/forudid_analysis", editable = true }

[project.scripts]
forudid = "forudid_api.cli:main"

[dependency-groups]
ingest = ["h5py>=3.15,<4"]
dev = [{include-group = "ingest"}, "pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pyright>=1.1.400", "rio-cogeo>=5.4,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
