name: Local WebGIS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FORUDID_REAL_SOURCE_TESTS: '1'
      FORUDID_OSM_TESTS: '1'
      FORUDID_MARTIN_TESTS: '1'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.24.0'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --frozen
      - run: python3 scripts/init_env.py
      - run: docker compose up -d --wait postgres object-storage
      - name: Migration round trip on fresh CI database
        run: |
          uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
          uv run --project apps/api alembic -c apps/api/alembic.ini downgrade -1
          uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
          uv run --project apps/api python -m forudid_api.seed
      - name: Acquire and publish the verified historical snapshot
        run: |
          uv run --project apps/api python -m forudid_api.ingest data/sources/haghighi-motagh-2024/1.0.0
          uv run --project apps/api python -m forudid_api.register_source data/sources/haghighi-motagh-2024/1.0.0
          uv run --project apps/api python -m forudid_api.normalize data/sources/haghighi-motagh-2024/1.0.0 data/normalized/haghighi-motagh-cog-1
          uv run --project apps/api python -m forudid_api.publish_historical data/sources/haghighi-motagh-2024/1.0.0 data/normalized/haghighi-motagh-cog-1
      - name: Import real infrastructure and start restricted vector tiles
        run: |
          uv run --project apps/api python -m forudid_api.ingest_osm data/sources/geofabrik-iran/260904
          uv run --project apps/api python -m forudid_api.configure_martin .tools/martin.json
          docker run -d --rm --name forudid-martin-ci --network host -v "$PWD/.tools/martin.json:/runtime/martin.json:ro" ghcr.io/maplibre/martin:1.15.0 --config /runtime/martin.json
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:58300/vector/health
      - name: Contract synchronization
        run: |
          uv run --project apps/api python scripts/export_openapi.py
          pnpm generate:api
          git diff --exit-code -- docs/openapi.json apps/web/src/generated/api
      - run: make check
      - run: pnpm --filter @forudid/web exec playwright install --with-deps chromium
      - run: FORUDID_START_SERVERS=1 pnpm test:e2e
      - name: Verify complete static stack
        run: |
          docker compose up -d --build --wait
          curl --fail http://localhost:58080/health/ready
          curl --fail http://localhost:58080/map
      - name: Stop this project's containers
        if: always()
        run: |
          docker stop forudid-martin-ci || true
          docker compose down
