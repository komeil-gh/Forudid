name: Source checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.24.0'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
          python-version: '3.13'
      - name: Scan committed history
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --log-opts=--all /repo
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --frozen
      - run: python3 scripts/init_env.py
      - run: make check-source
      - name: Contract synchronization
        run: |
          uv run --project apps/api python scripts/export_openapi.py
          pnpm generate:api
          git diff --exit-code -- docs/openapi.json apps/web/src/generated/api
      - name: Verify source archive boundary
        run: python3 scripts/release_source.py
